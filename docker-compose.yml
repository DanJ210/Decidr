services:
  db:
    image: postgres:16-alpine
    restart: unless-stopped
    ports:
      - "5433:5432"
    environment:
      POSTGRES_DB: ${POSTGRES_DB:-decidr_dev}
      POSTGRES_USER: ${POSTGRES_USER:-decidr}
      POSTGRES_PASSWORD: ${POSTGRES_PASSWORD:?POSTGRES_PASSWORD is required}
    volumes:
      - db_data:/var/lib/postgresql/data
    healthcheck:
      test: ["CMD-SHELL", "pg_isready -U ${POSTGRES_USER:-decidr} -d ${POSTGRES_DB:-decidr_dev}"]
      interval: 5s
      timeout: 5s
      retries: 5

volumes:
  db_data:
